[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [
    "venv",
    ".venv",
    "__pycache__",
    "*.egg-info",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors (PEP 8)
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "PIE",  # flake8-pie (incluye PIE790: return/break/continue en finally — PEP 765)
    "RET",  # flake8-return
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
]
ignore = [
    "E203",  # espaciado compatible con black
    "E501",  # permitir líneas largas si no exceden mucho
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # permitir imports no usados en __init__

[tool.ruff.lint.isort]
known-first-party = ["triton_telemetry"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: Tests unitarios aislados",
    "integration: Tests de integración entre módulos",
    "e2e: Tests end-to-end con APIs reales",
    "chaos: Tests de inyección de caos",
    "hardgate: Tests de hard gates obligatorios",
    "slow: Tests que requieren red real (pueden ser lentos)",
]
